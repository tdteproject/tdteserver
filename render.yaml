services:
  - type: web
    name: pdt-backend
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npm run db:deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set manually in Render Dashboard or provide if safe
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false # Set manually in Render Dashboard
      - key: SUPABASE_URL
        sync: false # Set manually
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Set manually
      - key: SMTP_SERVICE
        value: gmail
      - key: SMTP_AUTH_TYPE
        value: password
      - key: SMTP_USER
        sync: false # Set manually
      - key: SMTP_PASS
        sync: false # For Gmail app password or switch to OAuth2 below
      - key: OTP_FROM_EMAIL
        sync: false # Usually same as SMTP_USER for Gmail
      - key: OTP_FROM_NAME
        value: PDT Admin
      - key: EMAIL_OTP_ALLOW_CONSOLE_FALLBACK
        value: false
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: PORT
        value: 10000
